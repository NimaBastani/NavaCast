[package]
name = "navacast"
version = "1.0.0"
edition = "2021"
description = "NavaCast radio server: AutoDJ, live sources, HLS, and the Icecast source protocol"
license = "MIT"

[[bin]]
name = "navad"
path = "src/bin/navad.rs"

[[bin]]
name = "navactl"
path = "src/bin/navactl.rs"

[dependencies]
argon2 = { version = "=0.5.3", default-features = false }
base64ct = "=1.7.3"
base64 = "0.22"
ctrlc = "3.4"
getrandom = "0.2"
include_dir = "0.7"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mp3lame-encoder = { version = "=0.2.5", features = ["std"] }
opus = "=0.4.0"
symphonia = { version = "=0.5.4", default-features = false, features = ["mp3", "wav", "pcm"] }
symphonia-core = "=0.5.4"
symphonia-bundle-mp3 = "=0.5.4"
symphonia-metadata = "=0.5.4"
symphonia-format-riff = "=0.5.4"
symphonia-codec-pcm = "=0.5.4"
encoding_rs = "=0.8.35"
bytemuck = "=1.21.0"
log = "=0.4.25"
rustls = { version = "=0.23.22", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=0.26.8"
# Pins keep the TLS stack on the Rust 1.83 graph. Newer releases need edition 2024.
rustls-pki-types = "=1.10.1"
rustls-webpki = "=0.102.8"
zeroize = "=1.8.1"
futures = "=0.3.31"
slog = "=2.7.0"
tokio = { version = "=1.41.1", features = ["macros", "net", "rt", "sync", "time"] }
tsclientlib = { version = "=0.2.0", default-features = false }
tsproto-packets = "=0.1.0"
# url 2.5 pulls idna 1. idna_adapter 1.2 pulls ICU 2, which needs edition 2024.
idna = "=1.0.3"
idna_adapter = "=1.1.0"
# time 0.3.37+ pulls time-core, which needs edition 2024 on this toolchain.
time = "=0.3.36"
